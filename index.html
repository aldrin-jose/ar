<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- MindAR & A-Frame Libraries -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- MindAR Scene referencing target.mind -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Asset Definitions for Shiva (Target 0) -->
        <a-asset-item id="shivaModel" src="./models/shiva.gltf"></a-asset-item>

        <!-- Asset Definitions for Boat (Target 1) -->
        <a-asset-item id="boatModel" src="./models/boat.gltf"></a-asset-item>

        <!-- Asset Definitions for Crown (Target 2) -->
        <a-asset-item id="crownModel" src="./models/crown.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET 0: SHIVA (Image 1) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="#shivaModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

      <!-- TARGET 1: BOAT (Image 2) -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model 
          src="#boatModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

      <!-- TARGET 2: CROWN (Image 3) -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model 
          src="#crownModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
