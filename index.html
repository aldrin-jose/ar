<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR Image Tracking Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* User Interaction Overlay to enable audio/speech on mobile browsers */
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        font-family: sans-serif;
      }

      #start-btn {
        padding: 14px 28px;
        font-size: 18px;
        font-weight: bold;
        background-color: #008cba;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      }

      #start-btn:active {
        background-color: #005f73;
      }
    </style>
  </head>
  <body>
    <!-- Start Screen Overlay required for mobile browser speech audio permission -->
    <div id="overlay">
      <h2>WebAR Narration Experience</h2>
      <p>Tap the button below to enable camera and voice output.</p>
      <button id="start-btn">Start AR & Enable Audio</button>
    </div>

    <!-- MindAR Scene -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- Preload 3D Models -->
      <a-assets>
        <a-asset-item id="swordModel" src="./sword.glb"></a-asset-item>
        <a-asset-item id="boatModel" src="./boat.glb"></a-asset-item>
        <a-asset-item id="crownModel" src="./crown.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Shiva image -> Sword GLB -->
      <a-entity id="target-sword" mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="#swordModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

      <!-- Target 1: Boat image -> Boat GLB -->
      <a-entity id="target-boat" mindar-image-target="targetIndex: 1">
        <a-gltf-model 
          src="#boatModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

      <!-- Target 2: Crown image -> Crown GLB -->
      <a-entity id="target-crown" mindar-image-target="targetIndex: 2">
        <a-gltf-model 
          src="#crownModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

    </a-scene>

    <script>
      // Cache fetched text content so it isn't repeatedly requested
      const textCache = {};

      async function fetchText(fileUrl) {
        if (textCache[fileUrl]) return textCache[fileUrl];
        try {
          const response = await fetch(fileUrl);
          if (response.ok) {
            const text = await response.text();
            textCache[fileUrl] = text;
            return text;
          }
        } catch (err) {
          console.warn("Could not load text file:", fileUrl, err);
        }
        return null;
      }

      function speak(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel(); // Stop any ongoing speech
          if (!text) return;
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.95; // Speech speed rate
          window.speechSynthesis.speak(utterance);
        }
      }

      function stopSpeech() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const startBtn = document.getElementById("start-btn");
        const overlay = document.getElementById("overlay");

        // Unlock web audio context on user interaction
        startBtn.addEventListener("click", () => {
          overlay.style.display = "none";
          if ('speechSynthesis' in window) {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
          }
        });

        // Mapping target IDs to their text description files
        const targets = [
          { id: "target-sword", file: "./sword.txt" }, // Target Index 0 (Shiva Image)
          { id: "target-boat",  file: "./boat.txt"  }, // Target Index 1 (Boat Image)
          { id: "target-crown", file: "./crown.txt" }  // Target Index 2 (Crown Image)
        ];

        // Preload text files in background
        targets.forEach(t => fetchText(t.file));

        // Add event listeners for image detection and loss
        targets.forEach(targetInfo => {
          const el = document.getElementById(targetInfo.id);
          if (el) {
            el.addEventListener("targetFound", async () => {
              const description = await fetchText(targetInfo.file);
              if (description) {
                speak(description);
              }
            });

            el.addEventListener("targetLost", () => {
              stopSpeech();
            });
          }
        });
      });
    </script>
  </body>
</html>
