<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR WebAR Project with Text-to-Speech</title>

  <!-- Mobile Console Debugger -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- A-Frame and MindAR Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="10000">
      <a-asset-item id="animatedModel" src="./crown.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
    </a-assets>

    <!-- Essential Lighting -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" intensity="2.5" position="1 2 1"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- AR Target Container -->
    <a-entity mindar-image-target="targetIndex: 0" id="arTarget">
      <a-gltf-model
        id="modelEntity"
        src="#animatedModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        animation-mixer="clip: *; loop: repeat">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const target = document.getElementById("arTarget");
      let voiceText = ""; // Holds text loaded from speech.txt
      const synth = window.speechSynthesis; // Built-in Speech Engine

      // 1. Fetch text file from your server folder
      fetch('./speech.txt')
        .then(response => {
          if (!response.ok) throw new Error("Failed to load speech.txt");
          return response.text();
        })
        .then(data => {
          voiceText = data.trim();
          console.log("📄 File Content Loaded:", voiceText);
        })
        .catch(err => console.error("❌ Error reading speech.txt:", err));

      // 2. Play text-to-speech when scanned
      target.addEventListener("targetFound", () => {
        console.log("✅ MindAR Target Found!");
        
        if (voiceText && synth) {
          // Stop any active speech first
          synth.cancel();

          const utterance = new SpeechSynthesisUtterance(voiceText);
          utterance.rate = 0.9;  // Adjust reading speed (0.5 to 1.5)
          utterance.pitch = 1.0; // Adjust pitch

          synth.speak(utterance);
        }
      });

      // 3. Stop speech when target is lost
      target.addEventListener("targetLost", () => {
        console.log("❌ MindAR Target Lost");
        if (synth) {
          synth.cancel(); // Stops reading immediately
        }
      });
    });
  </script>

</body>
</html>
