<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museum Guidance AR</title>

  <!-- Mobile Debug Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Component to fix scale/frustum clipping issues -->
  <script>
    AFRAME.registerComponent('no-cull', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.traverse((node) => {
              if (node.isMesh) {
                node.frustumCulled = false;
              }
            });
          }
        });
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
    mindar-image="imageTargetSrc: ./test.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Assets -->
    <a-assets timeout="10000">
        <a-asset-item id="ganapathyModel" src="./ganapathy.glb" response-type="arraybuffer"></a-asset-item>
        <a-asset-item id="boatModel" src="./boat.glb" response-type="arraybuffer"></a-asset-item>
        <a-asset-item id="crownModel" src="./crown.glb" response-type="arraybuffer"></a-asset-item>
    </a-assets>

    <!-- Lighting -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" intensity="2.5" position="1 2 1"></a-light>

    <!-- Camera -->
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- ========================================= -->
    <!-- Target 0: Ganapathy (Image 1 in test.mind) -->
    <!-- ========================================= -->
    <a-entity id="ganapathyTarget" mindar-image-target="targetIndex:0">
        <a-gltf-model
            id="ganapathyEntity"
            src="#ganapathyModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.5 0.5 0.5"
            no-cull>
        </a-gltf-model>
    </a-entity>

    <!-- ========================================= -->
    <!-- Target 1: Boat (Image 2 in test.mind)     -->
    <!-- ========================================= -->
    <a-entity id="boatTarget" mindar-image-target="targetIndex:1">
        <a-gltf-model
            id="boatEntity"
            src="#boatModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.5 0.5 0.5"
            no-cull>
        </a-gltf-model>
    </a-entity>

    <!-- ========================================= -->
    <!-- Target 2: Crown (Image 3 in test.mind)    -->
    <!-- ========================================= -->
    <a-entity id="crownTarget" mindar-image-target="targetIndex:2">
        <a-gltf-model
            id="crownEntity"
            src="#crownModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.5 0.5 0.5"
            no-cull>
        </a-gltf-model>
    </a-entity>

</a-scene>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const synth = window.speechSynthesis;
    let speechText = "";

    fetch("./speech.txt")
        .then(response => {
            if (!response.ok) throw new Error("Failed to load speech.txt");
            return response.text();
        })
        .then(text => {
            speechText = text.trim();
        })
        .catch(error => console.error(error));

    function speakText() {
        if (!speechText) return;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(speechText);
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        synth.speak(utterance);
    }

    function stopSpeech() {
        synth.cancel();
    }

    // Target 0: Ganapathy
    const ganapathyTarget = document.getElementById("ganapathyTarget");
    ganapathyTarget.addEventListener("targetFound", () => {
        console.log("🐘 Ganapathy Target Found");
        speakText();
    });
    ganapathyTarget.addEventListener("targetLost", () => stopSpeech());

    // Target 1: Boat
    const boatTarget = document.getElementById("boatTarget");
    boatTarget.addEventListener("targetFound", () => {
        console.log("🚤 Boat Target Found");
        speakText();
    });
    boatTarget.addEventListener("targetLost", () => stopSpeech());

    // Target 2: Crown
    const crownTarget = document.getElementById("crownTarget");
    crownTarget.addEventListener("targetFound", () => {
        console.log("👑 Crown Target Found");
        speakText();
    });
    crownTarget.addEventListener("targetLost", () => stopSpeech());
});
</script>

</body>
</html>
