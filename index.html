<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub WebAR Viewer with Voice Narration</title>
  
  <!-- Import Model Viewer component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* UI Overlay */
    .controls-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      width: 90%;
      max-width: 400px;
    }

    .selector-box {
      width: 100%;
      padding: 12px;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      backdrop-filter: blur(10px);
      outline: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: #007aff;
      color: #ffffff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      backdrop-filter: blur(10px);
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Custom AR Button */
    #ar-button {
      background-color: #34c759;
      color: white;
    }

    /* Subtitles / Text Display Box */
    .text-card {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      max-height: 150px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
      color: #e0e0e0;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Subtitle Display -->
  <div class="text-card" id="description-box">
    Loading description...
  </div>

  <!-- WebAR Viewer -->
  <model-viewer 
    id="viewer"
    src="" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    touch-action="pan-y"
    auto-rotate 
    shadow-intensity="1"
    alt="3D AR Model">
    
    <button slot="ar-button" id="ar-button" class="btn">
      📱 View in your space (AR)
    </button>
  </model-viewer>

  <!-- Controls Container -->
  <div class="controls-container">
    <select id="model-select" class="selector-box">
      <!-- Add your GLB file base names here -->
      <option value="model1">Model 1</option>
      <option value="model2">Model 2</option>
    </select>

    <div class="button-group">
      <button id="speak-btn" class="btn btn-primary">🔊 Read Text</button>
      <button id="stop-btn" class="btn btn-secondary">⏹ Stop</button>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const modelSelect = document.getElementById('model-select');
    const descBox = document.getElementById('description-box');
    const speakBtn = document.getElementById('speak-btn');
    const stopBtn = document.getElementById('stop-btn');

    let currentText = "";
    const synth = window.speechSynthesis;

    // Load selected GLB and matching .txt file
    async function loadModelData(modelName) {
      stopSpeech();

      const glbPath = `./${modelName}.glb`;
      const txtPath = `./${modelName}.txt`;

      // Update 3D Model source
      viewer.setAttribute('src', glbPath);

      // Fetch corresponding text file
      try {
        const response = await fetch(txtPath);
        if (!response.ok) throw new Error(`Text file not found: ${txtPath}`);
        currentText = await response.text();
        descBox.innerText = currentText;
      } catch (err) {
        console.warn(err);
        currentText = "No description available for this model.";
        descBox.innerText = currentText;
      }
    }

    // Text-to-Speech Function
    function speakText() {
      if (!currentText || !synth) return;

      stopSpeech();

      const utterance = new SpeechSynthesisUtterance(currentText);
      utterance.rate = 0.95; // Slightly slower for clear narration
      utterance.pitch = 1.0;

      synth.speak(utterance);
    }

    // Stop Speech Function
    function stopSpeech() {
      if (synth && synth.speaking) {
        synth.cancel();
      }
    }

    // Event Listeners
    modelSelect.addEventListener('change', (e) => {
      loadModelData(e.target.value);
    });

    speakBtn.addEventListener('click', speakText);
    stopBtn.addEventListener('click', stopSpeech);

    // Auto-read when entering AR mode
    viewer.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'session-started') {
        speakText();
      }
    });

    // Initial Load
    window.addEventListener('DOMContentLoaded', () => {
      loadModelData(modelSelect.value);
    });
  </script>
</body>
</html>
