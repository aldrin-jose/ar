<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museum guidance</title>

  <!-- Mobile Debug Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Animation Mixer -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
    mindar-image="imageTargetSrc: ./test.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Assets -->
    <a-assets timeout="10000">

        <!-- Crown Model -->
        <a-asset-item
            id="crownModel"
            src="./crown.glb"
            response-type="arraybuffer">
        </a-asset-item>

        <!-- Boat Model -->
        <a-asset-item
            id="boatModel"
            src="./boat.glb"
            response-type="arraybuffer">
        </a-asset-item>

    </a-assets>

    <!-- Lighting -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" intensity="2.5" position="1 2 1"></a-light>

    <!-- Camera -->
    <a-camera
        position="0 0 0"
        look-controls="enabled:false">
    </a-camera>

    <!-- ========================== -->
    <!-- Crown Target (Target 0) -->
    <!-- ========================== -->

    <a-entity
        id="crownTarget"
        mindar-image-target="targetIndex:0">

        <a-gltf-model
            id="crownEntity"
            src="#crownModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.5 0.5 0.5"
            animation-mixer="clip:*; loop:repeat">
        </a-gltf-model>

    </a-entity>

    <!-- ========================== -->
    <!-- Boat Target (Target 1) -->
    <!-- ========================== -->

    <a-entity
        id="boatTarget"
        mindar-image-target="targetIndex:1">

        <!-- Fixed position offset and removed animation-mixer -->
        <a-gltf-model
            id="boatEntity"
            src="#boatModel"
            position="2.5 -0.6 -3.9"
            rotation="0 0 0"
            scale="1 1 1">
        </a-gltf-model>

    </a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const synth = window.speechSynthesis;
    let speechText = "";

    // Load speech text
    fetch("./speech.txt")
        .then(response => {
            if (!response.ok) throw new Error("Failed to load speech.txt");
            return response.text();
        })
        .then(text => {
            speechText = text.trim();
            console.log("Speech Loaded:", speechText);
        })
        .catch(error => {
            console.error(error);
        });

    function speakText() {

        if (!speechText) return;

        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(speechText);

        utterance.rate = 0.9;
        utterance.pitch = 1.0;

        synth.speak(utterance);
    }

    function stopSpeech() {
        synth.cancel();
    }

    // Crown Events
    const crownTarget = document.getElementById("crownTarget");

    crownTarget.addEventListener("targetFound", () => {
        console.log("👑 Crown Target Found");
        speakText();
    });

    crownTarget.addEventListener("targetLost", () => {
        console.log("👑 Crown Target Lost");
        stopSpeech();
    });

    // Boat Events
    const boatTarget = document.getElementById("boatTarget");

    boatTarget.addEventListener("targetFound", () => {
        console.log("🚤 Boat Target Found");
        speakText();
    });

    boatTarget.addEventListener("targetLost", () => {
        console.log("🚤 Boat Target Lost");
        stopSpeech();
    });

});

</script>

</body>
</html>
