<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR Image Tracking Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- 
      MindAR Scene setup:
      - imageTargetSrc links directly to your targets.mind file
      - maxTrack: set to the number of targets compiled inside targets.mind
    -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- Assets Preloader -->
      <a-assets>
        <a-asset-item id="crownModel" src="./crown.glb"></a-asset-item>
        <a-asset-item id="boatModel" src="./boat.glb"></a-asset-item>
        <a-asset-item id="swordModel" src="./sword.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 (First image compiled in targets.mind) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="#crownModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

      <!-- Target 1 (Second image compiled in targets.mind) -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model 
          src="#boatModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

      <!-- Target 2 (Third image compiled in targets.mind) -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model 
          src="#swordModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
