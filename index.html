<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Museum Guidance Robot</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR Image Tracking Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- MindAR Gesture Handlers (For rotation and pinch-to-zoom) -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/src/image-target/aframe/gesture-detector.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/src/image-target/aframe/gesture-handler.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0d1117;
      }

      /* Animated Launch Overlay */
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0c10 0%, #1a1f2c 100%);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      /* Glowing Animated Title */
      .app-title {
        font-size: 2.2rem;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: linear-gradient(90deg, #00f2fe, #4facfe, #00f2fe);
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shine 3s linear infinite, float 3s ease-in-out infinite;
        margin-bottom: 8px;
      }

      .app-subtitle {
        font-size: 1rem;
        color: #8b949e;
        margin-bottom: 30px;
        animation: fadeIn 1.5s ease-in-out;
      }

      /* Pulse Animated Icon */
      .robot-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }

      /* Start Button with Hover/Pulse */
      #start-btn {
        padding: 16px 36px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #ffffff;
        background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(0, 114, 255, 0.4);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      #start-btn:active {
        transform: scale(0.96);
        box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3);
      }

      /* On-screen Instruction Banner */
      #instruction-hint {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(13, 17, 23, 0.75);
        color: #00f2fe;
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        pointer-events: none;
        border: 1px solid rgba(0, 242, 254, 0.3);
        z-index: 10;
        display: none;
      }

      /* Keyframe Animations */
      @keyframes shine {
        to { background-position: 200% center; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
        100% { transform: scale(1); opacity: 0.9; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Fade Out Transition */
      .fade-out {
        opacity: 0;
        transition: opacity 0.8s ease-out;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Animated Opening Overlay -->
    <div id="overlay">
      <svg class="robot-icon" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <circle cx="12" cy="5" r="2"></circle>
        <path d="M12 7v4"></path>
        <line x1="8" y1="16" x2="8.01" y2="16" stroke-width="3"></line>
        <line x1="16" y1="16" x2="16.01" y2="16" stroke-width="3"></line>
      </svg>
      <h1 class="app-title">Museum Guidance Robot</h1>
      <p class="app-subtitle">Interactive WebAR Tour Guide</p>
      <button id="start-btn">Start Tour & Voice Guide</button>
    </div>

    <!-- User Instruction Banner -->
    <div id="instruction-hint">👆 Drag to rotate 3D model | Pinch to zoom</div>

    <!-- MindAR Scene with Gesture Detector Enabled -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3;" 
      gesture-detector
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- Assets Preloader -->
      <a-assets>
        <a-asset-item id="swordModel" src="./sword.glb"></a-asset-item>
        <a-asset-item id="boatModel" src="./boat.glb"></a-asset-item>
        <a-asset-item id="crownModel" src="./crown.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Shiva image -> Sword GLB (Interactive Rotation Enabled) -->
      <a-entity id="target-sword" mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          class="cantap"
          gesture-handler="minScale: 0.1; maxScale: 3"
          src="#swordModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

      <!-- Target 1: Boat image -> Boat GLB (Interactive Rotation Enabled) -->
      <a-entity id="target-boat" mindar-image-target="targetIndex: 1">
        <a-gltf-model 
          class="cantap"
          gesture-handler="minScale: 0.1; maxScale: 3"
          src="#boatModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

      <!-- Target 2: Crown image -> Crown GLB (Interactive Rotation Enabled) -->
      <a-entity id="target-crown" mindar-image-target="targetIndex: 2">
        <a-gltf-model 
          class="cantap"
          gesture-handler="minScale: 0.1; maxScale: 3"
          src="#crownModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>

    </a-scene>

    <script>
      const textCache = {};

      async function fetchText(fileUrl) {
        if (textCache[fileUrl]) return textCache[fileUrl];
        try {
          const response = await fetch(fileUrl);
          if (response.ok) {
            const text = await response.text();
            textCache[fileUrl] = text;
            return text;
          }
        } catch (err) {
          console.warn("Could not load text file:", fileUrl, err);
        }
        return null;
      }

      function speak(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          if (!text) return;
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.95;
          window.speechSynthesis.speak(utterance);
        }
      }

      function stopSpeech() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const startBtn = document.getElementById("start-btn");
        const overlay = document.getElementById("overlay");
        const hint = document.getElementById("instruction-hint");

        startBtn.addEventListener("click", () => {
          overlay.classList.add("fade-out");
          setTimeout(() => {
            overlay.style.display = "none";
            hint.style.display = "block"; // Show user rotation hint
          }, 800);

          if ('speechSynthesis' in window) {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance('Welcome to the Museum Guidance Robot tour. Scan an exhibit target to begin.'));
          }
        });

        const targets = [
          { id: "target-sword", file: "./sword.txt" },
          { id: "target-boat",  file: "./boat.txt"  },
          { id: "target-crown", file: "./crown.txt" }
        ];

        targets.forEach(t => fetchText(t.file));

        targets.forEach(targetInfo => {
          const el = document.getElementById(targetInfo.id);
          if (el) {
            el.addEventListener("targetFound", async () => {
              const description = await fetchText(targetInfo.file);
              if (description) {
                speak(description);
              }
            });

            el.addEventListener("targetLost", () => {
              stopSpeech();
            });
          }
        });
      });
    </script>
  </body>
</html>
